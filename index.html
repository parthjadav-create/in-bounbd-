<!DOCTYPE html>
<html>
<head>
  <title>Live Performance Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI';
      background: #eef2f7;
    }

    .header {
      background: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      border-radius: 20px;
      margin: 15px;
    }

    .header h1 {
      margin: 0;
    }

    .btn {
      background: #2563eb;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    .main {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 15px;
      padding: 15px;
    }

    .card {
      color: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    .blue { background: #3b82f6; }
    .green { background: #22c55e; }
    .pink { background: #ec4899; }
    .orange { background: #f97316; }

    .card h2 {
      margin: 0;
    }

    .table-box {
      background: white;
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 8px;
    }

    th {
      background: #1e293b;
      color: white;
    }

    tr:nth-child(even) {
      background: #f3f4f6;
    }

    select {
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

  </style>
</head>

<body>

<div class="header">
  <h1>📊 Live Performance Dashboard</h1>
  <button class="btn" onclick="loadData()">Refresh</button>
</div>

<div class="main">

  <!-- LEFT CARDS -->
  <div>
    <div class="card blue">Total Leads<h2 id="total">0</h2></div>
    <div class="card green">Single Outlet<h2 id="single">0</h2></div>
    <div class="card pink">Chain<h2 id="chain">0</h2></div>
    <div class="card orange">States<h2 id="states">0</h2></div>
  </div>

  <!-- RIGHT CONTENT -->
  <div>

    <!-- MAIN TABLE -->
    <div class="table-box">
      <h3>📋 All Data</h3>
      <table>
        <thead>
          <tr>
            <th>Restaurant</th>
            <th>City</th>
            <th>State</th>
            <th>Type</th>
            <th>Agent</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <!-- FILTER -->
    <div class="table-box">
      <h3>🎯 Agent Analysis</h3>

      <select id="nameFilter">
        <option value="">Select Agent</option>
      </select>

      <!-- STATUS TABLE -->
      <h4>Final Status Count</h4>
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Count</th>
          </tr>
        </thead>
        <tbody id="statusBody"></tbody>
      </table>

      <!-- REMARKS TABLE -->
      <h4 style="margin-top:15px;">Remarks Count</h4>
      <table>
        <thead>
          <tr>
            <th>Remarks</th>
            <th>Count</th>
          </tr>
        </thead>
        <tbody id="remarksBody"></tbody>
      </table>

    </div>

  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwoUUmuGK5BiS6AvD5VXqr0K_rBrTAQ-zFSS6UrmYdOdDPAb6IVW8lizQHv-09VX8br/exec";

let dataGlobal = [];

function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      dataGlobal = data;
      renderStats(data);
      renderTable(data);
      populateNames(data);
    });
}

function renderStats(data) {
  document.getElementById("total").innerText = data.length;

  document.getElementById("single").innerText =
    data.filter(d => d["Chain or not"] === "Single Outlet").length;

  document.getElementById("chain").innerText =
    data.filter(d => (d["Chain or not"] || "").includes("Chain")).length;

  const states = [...new Set(data.map(d => d.State))];
  document.getElementById("states").innerText = states.length;
}

function renderTable(data) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  data.slice(0, 100).forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row["Restaurant Name"]}</td>
        <td>${row["City"]}</td>
        <td>${row["State"]}</td>
        <td>${row["Chain or not"]}</td>
        <td>${row["Name"]}</td>
        <td>${row["FinalStatus"]}</td>
      </tr>
    `;
  });
}

function populateNames(data) {
  const names = [...new Set(data.map(d => d["Name"]))];
  const dropdown = document.getElementById("nameFilter");

  dropdown.innerHTML = '<option value="">Select Agent</option>';

  names.forEach(name => {
    dropdown.innerHTML += `<option value="${name}">${name}</option>`;
  });
}

document.getElementById("nameFilter").addEventListener("change", function() {
  const selected = this.value;

  const filtered = dataGlobal.filter(d => d["Name"] === selected);

  renderStatusCount(filtered);
  renderRemarksCount(filtered);
});

function renderStatusCount(data) {
  const counts = {};
  data.forEach(row => {
    const key = row["FinalStatus"] || "Blank";
    counts[key] = (counts[key] || 0) + 1;
  });

  const tbody = document.getElementById("statusBody");
  tbody.innerHTML = "";

  Object.entries(counts).forEach(([k, v]) => {
    tbody.innerHTML += `<tr><td>${k}</td><td>${v}</td></tr>`;
  });
}

function renderRemarksCount(data) {
  const counts = {};
  data.forEach(row => {
    const key = row["Remarks"] || "Blank";
    counts[key] = (counts[key] || 0) + 1;
  });

  const tbody = document.getElementById("remarksBody");
  tbody.innerHTML = "";

  Object.entries(counts).forEach(([k, v]) => {
    tbody.innerHTML += `<tr><td>${k}</td><td>${v}</td></tr>`;
  });
}

loadData();

</script>

</body>
</html>
