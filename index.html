<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Lead Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI';
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    h1 {
      text-align: center;
      padding: 20px;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      padding: 15px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255,255,255,0.05);
    }

    th, td {
      padding: 8px;
      font-size: 12px;
    }

    th {
      background: #2563eb;
    }

    input {
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-bottom: 10px;
      width: 300px;
    }
  </style>
</head>

<body>

<h1>📊 Restaurant Lead Dashboard</h1>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Total Leads</h3>
      <p id="total"></p>
    </div>

    <div class="card">
      <h3>Single Outlet</h3>
      <p id="single"></p>
    </div>

    <div class="card">
      <h3>Chain Outlets</h3>
      <p id="chain"></p>
    </div>

    <div class="card">
      <h3>States Covered</h3>
      <p id="states"></p>
    </div>
  </div>

  <input type="text" id="search" placeholder="Search restaurant, city, owner...">

  <table>
    <thead>
      <tr>
        <th>Res ID</th>
        <th>Date</th>
        <th>Restaurant</th>
        <th>Owner</th>
        <th>City</th>
        <th>State</th>
        <th>Type</th>
        <th>Call Date</th>
        <th>Agent</th>
        <th>Remarks</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwoUUmuGK5BiS6AvD5VXqr0K_rBrTAQ-zFSS6UrmYdOdDPAb6IVW8lizQHv-09VX8br/exec";

let dataGlobal = [];

fetch(API_URL)
.then(res => res.json())
.then(data => {
  dataGlobal = data;
  renderStats(data);
  renderTable(data);
})
.catch(err => {
  alert("Error fetching data. Check permissions or URL.");
  console.error(err);
});

function renderStats(data) {
  document.getElementById("total").innerText = data.length;

  document.getElementById("single").innerText =
    data.filter(d => d["Chain or not"] === "Single Outlet").length;

  document.getElementById("chain").innerText =
    data.filter(d => (d["Chain or not"] || "").includes("Chain")).length;

  const states = [...new Set(data.map(d => d.State))];
  document.getElementById("states").innerText = states.length;
}

function renderTable(data) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  data.forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row["Res ID"]}</td>
        <td>${row["Res Created Date"]}</td>
        <td>${row["Restaurant Name"]}</td>
        <td>${row["Owner Name and Number"]}</td>
        <td>${row["City"]}</td>
        <td>${row["State"]}</td>
        <td>${row["Chain or not"]}</td>
        <td>${row["Call Date"]}</td>
        <td>${row["Name"]}</td>
        <td>${row["Remarks"]}</td>
        <td>${row["FinalStatus"]}</td>
      </tr>
    `;
  });
}

document.getElementById("search").addEventListener("input", function() {
  const val = this.value.toLowerCase();

  const filtered = dataGlobal.filter(row =>
    Object.values(row).some(v =>
      String(v).toLowerCase().includes(val)
    )
  );

  renderTable(filtered);
});

</script>

</body>
</html>
