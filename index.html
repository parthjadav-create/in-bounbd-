<!DOCTYPE html>
<html>
<head>
  <title>Live Performance Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI';
      background: #eef2f7;
    }

    .header {
      background: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 20px;
      margin: 15px;
    }

    .btn {
      background: #2563eb;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    .sync-time {
      font-size: 12px;
      color: #555;
      margin-right: 15px;
    }

    .main {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 15px;
      padding: 15px;
    }

    .card {
      color: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    .blue { background: #3b82f6; }
    .green { background: #22c55e; }
    .pink { background: #ec4899; }
    .orange { background: #f97316; }

    .table-box {
      background: white;
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td { padding: 8px; }

    th {
      background: #1e293b;
      color: white;
    }

    tr:nth-child(even) {
      background: #f3f4f6;
    }

    select {
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 10px;
      margin-right: 10px;
    }
  </style>
</head>

<body>

<div class="header">
  <h2>📊 Live Performance Dashboard</h2>

  <div style="display:flex; align-items:center;">
    <div class="sync-time" id="lastSync">Last Sync: --</div>
    <button class="btn" onclick="loadData()">Refresh</button>
  </div>
</div>

<div class="main">

  <!-- LEFT -->
  <div>
    <div class="card blue">Total Leads<h2 id="total">0</h2></div>
    <div class="card green">Single Outlet<h2 id="single">0</h2></div>
    <div class="card pink">Chain<h2 id="chain">0</h2></div>
    <div class="card orange">States<h2 id="states">0</h2></div>
  </div>

  <!-- RIGHT -->
  <div>

    <div class="table-box">
      <h3>📋 All Data</h3>

      <select id="nameFilter">
        <option value="">Filter by Agent</option>
      </select>

      <select id="cityFilter">
        <option value="">Filter by City</option>
      </select>

      <table>
        <thead>
          <tr>
            <th>Restaurant</th>
            <th>City</th>
            <th>State</th>
            <th>Type</th>
            <th>Agent</th>
            <th>Mobile</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="table-box">
      <h3>🎯 Agent Analysis</h3>

      <h4>Final Status Count</h4>
      <table>
        <tbody id="statusBody"></tbody>
      </table>

      <h4 style="margin-top:15px;">Remarks Count</h4>
      <table>
        <tbody id="remarksBody"></tbody>
      </table>
    </div>

  </div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwoUUmuGK5BiS6AvD5VXqr0K_rBrTAQ-zFSS6UrmYdOdDPAb6IVW8lizQHv-09VX8br/exec";

let dataGlobal = [];

// 🔁 AUTO REFRESH EVERY 5 MINUTES
setInterval(() => {
  loadData();
}, 300000); // 300000 ms = 5 min

function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      dataGlobal = data;
      renderStats(data);
      renderTable(data);
      populateNames(data);
      populateCities(data);
      updateSyncTime(); // 👈 update time
    });
}

// 🕒 UPDATE LAST SYNC TIME
function updateSyncTime() {
  const now = new Date();
  document.getElementById("lastSync").innerText =
    "Last Sync: " + now.toLocaleTimeString();
}

function renderStats(data) {
  document.getElementById("total").innerText = data.length;

  document.getElementById("single").innerText =
    data.filter(d => d["Chain or not"] === "Single Outlet").length;

  document.getElementById("chain").innerText =
    data.filter(d => (d["Chain or not"] || "").includes("Chain")).length;

  const states = [...new Set(data.map(d => d.State))];
  document.getElementById("states").innerText = states.length;
}

function renderTable(data) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  data.slice(0, 100).forEach(row => {

    let mobile = "";
    if (row["Owner Name and Number"]) {
      const match = row["Owner Name and Number"].match(/\d+/);
      mobile = match ? match[0] : "";
    }

    tbody.innerHTML += `
      <tr>
        <td>${row["Restaurant Name"]}</td>
        <td>${row["City"]}</td>
        <td>${row["State"]}</td>
        <td>${row["Chain or not"]}</td>
        <td>${row["Name"]}</td>
        <td>${mobile}</td>
        <td>${row["FinalStatus"]}</td>
      </tr>
    `;
  });
}

function populateNames(data) {
  const names = [...new Set(data.map(d => d["Name"]))];
  const dropdown = document.getElementById("nameFilter");

  dropdown.innerHTML = '<option value="">Filter by Agent</option>';

  names.forEach(name => {
    dropdown.innerHTML += `<option value="${name}">${name}</option>`;
  });
}

function populateCities(data) {
  const cities = [...new Set(data.map(d => d["City"]))];
  const dropdown = document.getElementById("cityFilter");

  dropdown.innerHTML = '<option value="">Filter by City</option>';

  cities.forEach(city => {
    dropdown.innerHTML += `<option value="${city}">${city}</option>`;
  });
}

document.getElementById("nameFilter").addEventListener("change", applyFilters);
document.getElementById("cityFilter").addEventListener("change", applyFilters);

function applyFilters() {
  const name = document.getElementById("nameFilter").value;
  const city = document.getElementById("cityFilter").value;

  let filtered = dataGlobal;

  if (name) filtered = filtered.filter(d => d["Name"] === name);
  if (city) filtered = filtered.filter(d => d["City"] === city);

  renderTable(filtered);
  renderStatusCount(filtered);
  renderRemarksCount(filtered);
}

function renderStatusCount(data) {
  const counts = {};
  data.forEach(row => {
    const key = row["FinalStatus"] || "Blank";
    counts[key] = (counts[key] || 0) + 1;
  });

  const tbody = document.getElementById("statusBody");
  tbody.innerHTML = "";

  Object.entries(counts).forEach(([k, v]) => {
    tbody.innerHTML += `<tr><td>${k}</td><td>${v}</td></tr>`;
  });
}

function renderRemarksCount(data) {
  const counts = {};
  data.forEach(row => {
    const key = row["Remarks"] || "Blank";
    counts[key] = (counts[key] || 0) + 1;
  });

  const tbody = document.getElementById("remarksBody");
  tbody.innerHTML = "";

  Object.entries(counts).forEach(([k, v]) => {
    tbody.innerHTML += `<tr><td>${k}</td><td>${v}</td></tr>`;
  });
}

// INITIAL LOAD
loadData();

</script>

</body>
</html>
