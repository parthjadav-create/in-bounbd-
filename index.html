<!DOCTYPE html>
<html>
<head>
  <title>Live Performance Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI';
      background: #eef2f7;
    }

    /* HEADER */
    .header {
      background: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 20px;
      margin: 15px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    /* FILTER BAR */
    .filters {
      background: white;
      margin: 15px;
      padding: 15px;
      border-radius: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .filters input {
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    .btn {
      background: #2563eb;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
    }

    /* LAYOUT */
    .main {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 15px;
      padding: 15px;
    }

    /* LEFT CARDS */
    .card {
      color: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .blue { background: #3b82f6; }
    .green { background: #22c55e; }
    .pink { background: #ec4899; }
    .orange { background: #f97316; }
    .teal { background: #14b8a6; }

    .card h2 {
      margin: 0;
      font-size: 28px;
    }

    /* TABLE SECTION */
    .table-box {
      background: white;
      border-radius: 20px;
      padding: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px;
      text-align: left;
    }

    th {
      background: #1e293b;
      color: white;
    }

    tr:nth-child(even) {
      background: #f3f4f6;
    }

  </style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>📊 Live Performance Dashboard</h1>
  <button class="btn" onclick="loadData()">Refresh Now</button>
</div>

<!-- FILTERS -->
<div class="filters">
  From: <input type="date" id="fromDate">
  To: <input type="date" id="toDate">
</div>

<!-- MAIN -->
<div class="main">

  <!-- LEFT SIDE CARDS -->
  <div>
    <div class="card blue">TOTAL<br><h2 id="total">0</h2></div>
    <div class="card green">Single Outlet<br><h2 id="single">0</h2></div>
    <div class="card pink">Chain<br><h2 id="chain">0</h2></div>
    <div class="card orange">States<br><h2 id="states">0</h2></div>
  </div>

  <!-- RIGHT TABLE -->
  <div class="table-box">
    <table>
      <thead>
        <tr>
          <th>Restaurant</th>
          <th>City</th>
          <th>State</th>
          <th>Type</th>
          <th>Agent</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwoUUmuGK5BiS6AvD5VXqr0K_rBrTAQ-zFSS6UrmYdOdDPAb6IVW8lizQHv-09VX8br/exec";

function loadData() {
  fetch(API_URL)
    .then(res => res.json())
    .then(data => {
      renderStats(data);
      renderTable(data);
    });
}

function renderStats(data) {
  document.getElementById("total").innerText = data.length;

  document.getElementById("single").innerText =
    data.filter(d => d["Chain or not"] === "Single Outlet").length;

  document.getElementById("chain").innerText =
    data.filter(d => (d["Chain or not"] || "").includes("Chain")).length;

  const states = [...new Set(data.map(d => d.State))];
  document.getElementById("states").innerText = states.length;
}

function renderTable(data) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  data.slice(0, 50).forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row["Restaurant Name"]}</td>
        <td>${row["City"]}</td>
        <td>${row["State"]}</td>
        <td>${row["Chain or not"]}</td>
        <td>${row["Name"]}</td>
        <td>${row["FinalStatus"]}</td>
      </tr>
    `;
  });
}

loadData();

</script>

</body>
</html>
