<!DOCTYPE html>
<html>
<head>
  <title>Smart Inventory Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
    }

    h1 {
      text-align: center;
      padding: 20px;
      font-weight: 600;
    }

    .container {
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card h3 {
      margin: 0;
      font-size: 14px;
      color: #94a3b8;
    }

    .card p {
      font-size: 24px;
      margin-top: 10px;
      font-weight: bold;
    }

    .search-box {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
      width: 300px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 10px;
      font-size: 12px;
      text-align: left;
    }

    th {
      background: #2563eb;
    }

    tr:nth-child(even) {
      background: rgba(255,255,255,0.03);
    }

    tr:hover {
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>

<body>

<h1>📊 Inventory Intelligence Dashboard</h1>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Total Records</h3>
      <p id="total"></p>
    </div>

    <div class="card">
      <h3>Hyperpure Leads</h3>
      <p id="hyperpure"></p>
    </div>

    <div class="card">
      <h3>Purchases</h3>
      <p id="purchase"></p>
    </div>

    <div class="card">
      <h3>Unique Agents</h3>
      <p id="agents"></p>
    </div>
  </div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search anything...">
  </div>

  <table>
    <thead>
      <tr>
        <th>Date</th>
        <th>Interaction Type</th>
        <th>Customer Number</th>
        <th>Agent Name</th>
        <th>Call Related To</th>
        <th>Category</th>
        <th>Comments</th>
        <th>Hyperpure</th>
        <th>Purchase</th>
        <th>Restaurant ID</th>
        <th>Restaurant Name</th>
        <th>Status</th>
        <th>Norm Name</th>
        <th>Date (MM/DD/YYYY)</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</div>

<script>
const API_URL = "PASTE_YOUR_WEB_APP_URL_HERE";
let globalData = [];

fetch(API_URL)
  .then(res => res.json())
  .then(data => {
    globalData = data;
    renderStats(data);
    renderTable(data);
  });

function renderStats(data) {
  document.getElementById("total").innerText = data.length;

  document.getElementById("hyperpure").innerText =
    data.filter(d => d.Hyperpure_Lead === "Yes").length;

  document.getElementById("purchase").innerText =
    data.filter(d => d.Purchase_by_Petpooja === "Yes").length;

  const agents = [...new Set(data.map(d => d["Agent Name"]))];
  document.getElementById("agents").innerText = agents.length;
}

function renderTable(data) {
  const tbody = document.getElementById("tableBody");
  tbody.innerHTML = "";

  data.forEach(row => {
    tbody.innerHTML += `
      <tr>
        <td>${row["Date"]}</td>
        <td>${row["Interaction Type"]}</td>
        <td>${row["Customer Number"]}</td>
        <td>${row["Agent Name"]}</td>
        <td>${row["CallRealatedTo"]}</td>
        <td>${row["Category"]}</td>
        <td>${row["Comments1"]}</td>
        <td>${row["Hyperpure_Lead"]}</td>
        <td>${row["Purchase_by_Petpooja"]}</td>
        <td>${row["RestaurantId"]}</td>
        <td>${row["Restaurantname"]}</td>
        <td>${row["Status1"]}</td>
        <td>${row["Norm Name"]}</td>
        <td>${row["Date (mm/dd/yyyy)"]}</td>
      </tr>
    `;
  });
}

document.getElementById("search").addEventListener("input", function() {
  const value = this.value.toLowerCase();

  const filtered = globalData.filter(row =>
    Object.values(row).some(val =>
      String(val).toLowerCase().includes(value)
    )
  );

  renderTable(filtered);
});
</script>

</body>
</html>
